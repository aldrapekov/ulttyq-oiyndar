<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ÚLY DALA OIYNDARY</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="top-navbar">
        <button class="nav-btn" onclick="toggleSidebar()">☰</button>
        <div class="nav-title" data-i18n="navTitle">Úly Dala Oıyndary</div>
        
        <!-- Новый переключатель языков -->
        <div class="main-lang-switcher">
            <button onclick="setLanguage('kk')">KZ</button>
            <button onclick="setLanguage('ru')">RU</button>
            <button onclick="setLanguage('en')">EN</button>
        </div>
    </header>

    <div class="dark-overlay" id="dark-overlay" onclick="toggleSidebar()"></div>

    <nav class="sidebar" id="sidebar">
        <button class="close-sidebar" onclick="toggleSidebar()">✖</button>
        
        <a class="sidebar-item" href="index.html" style="color: #8e24aa; border-bottom: 2px solid #eee; margin-bottom: 10px;" data-i18n="menuHome">🏠 Басты бет / Главная</a>

        <!-- КЛИКАБЕЛЬНАЯ КАТЕГОРИЯ ИГР -->
        <div class="sidebar-category" onclick="toggleSubmenu('submenu-games', 'arrow-games')">
            <span data-i18n="catGames">Ұлттық ойындар / Игры</span>
            <span class="category-arrow" id="arrow-games">▼</span>
        </div>
        
        <!-- СКРЫТЫЙ СПИСОК ИГР (Свернут по умолчанию) -->
        <div class="submenu" id="submenu-games">
            <a class="sidebar-item" href="menu.html?game=arkan" data-i18n="gameArkan">➰ Арқан Тартыс</a>
            <a class="sidebar-item" href="menu.html?game=baige" data-i18n="gameBaige">🐎 Бәйге</a>
            <a class="sidebar-item" href="menu.html?game=asyk" data-i18n="gameAsyk">🦴 Асық Ату</a>
            <a class="sidebar-item" href="menu.html?game=kyzquu" data-i18n="gameKyzquu">🏇 Қыз қуу</a>
        </div>

        <!-- КЛИКАБЕЛЬНАЯ КАТЕГОРИЯ ИНСТРУМЕНТОВ -->
        <div class="sidebar-category" style="margin-top: 10px;" onclick="toggleSubmenu('submenu-tools', 'arrow-tools')">
            <span data-i18n="catTools">Құралдар / Инструменты</span>
            <span class="category-arrow" id="arrow-tools">▼</span>
        </div>
        
        <!-- СКРЫТЫЙ СПИСОК ИНСТРУМЕНТОВ (Свернут по умолчанию) -->
        <div class="submenu" id="submenu-tools">
            <a class="sidebar-item" href="selector.html" data-i18n="toolRandom">📷 Случайный ученик</a>
            <a class="sidebar-item" href="https://aldrapekov.github.io/trening/" data-i18n="toolTraining">🎯 Тренинг</a>
        </div>
    </nav>
    <video class="video-bg" id="bg-video" autoplay loop muted playsinline>
        <source src="intro_bg.mp4" type="video/mp4">
    </video>

    <div class="content-overlay">
        <div class="placeholder-text" data-i18n="centerText">
            Выберите игру в меню слева
        </div>
    </div>

    <button class="mute-btn" onclick="toggleMute()">🔇</button>

    <script>
        // --- СЛОВАРЬ ПЕРЕВОДОВ ---
        const translations = {
            ru: {
                navTitle: "Úly Dala Oıyndary",
                menuHome: "🏠 Главная",
                catGames: "Игры",
                gameArkan: "➰ Арқан Тартыс (Перетягивание каната)",
                gameBaige: "🐎 Бәйге (Скачки)",
                gameAsyk: "🦴 Асық Ату",
                gameKyzquu: "🏇 Қыз қуу (Догони девушку)",
                catTools: "Инструменты",
                toolRandom: "📷 Случайный ученик",
                toolTraining: "🎯 Тренинг",
                centerText: "Выберите игру в меню слева"
            },
            kk: {
                navTitle: "Ұлы Дала Ойындары",
                menuHome: "🏠 Басты бет",
                catGames: "Ұлттық ойындар",
                gameArkan: "➰ Арқан Тартыс",
                gameBaige: "🐎 Бәйге",
                gameAsyk: "🦴 Асық Ату",
                gameKyzquu: "🏇 Қыз қуу",
                catTools: "Құралдар",
                toolRandom: "📷 Кездейсоқ оқушы",
                toolTraining: "🎯 Тренинг",
                centerText: "Сол жақтағы мәзірден ойынды таңдаңыз"
            },
            en: {
                navTitle: "Games of the Great Steppe",
                menuHome: "🏠 Home",
                catGames: "National Games",
                gameArkan: "➰ Arkan Tartys (Tug of War)",
                gameBaige: "🐎 Baige (Horse Racing)",
                gameAsyk: "🦴 Asyk Atu",
                gameKyzquu: "🏇 Kyz Quu (Catch the Girl)",
                catTools: "Tools",
                toolRandom: "📷 Random Student",
                toolTraining: "🎯 Training",
                centerText: "Select a game from the left menu"
            }
        };

        // Функция смены языка
        function setLanguage(lang) {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    el.innerHTML = translations[lang][key];
                }
            });
            // Можно сохранить выбранный язык в localStorage, чтобы он не сбрасывался при обновлении страницы
            localStorage.setItem('siteLanguage', lang);
        }

        // При загрузке страницы проверяем, был ли ранее выбран язык
        window.onload = () => {
            const savedLang = localStorage.getItem('siteLanguage') || 'ru'; // По умолчанию русский
            setLanguage(savedLang);
        };

        // --- ЛОГИКА МЕНЮ И ВИДЕО ---
        function toggleMute() {
            const video = document.getElementById('bg-video');
            const btn = document.querySelector('.mute-btn');
            if (video) {
                video.muted = !video.muted;
                btn.innerText = video.muted ? '🔇' : '🔊';
            }
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('dark-overlay').classList.toggle('active');
        }
        // Функция для сворачивания/разворачивания списков (Аккордеон)
        function toggleSubmenu(submenuId, arrowId) {
            const submenu = document.getElementById(submenuId);
            const arrow = document.getElementById(arrowId);
            
            submenu.classList.toggle('open');
            arrow.classList.toggle('open');
        }
    </script>
</body>
</html>
