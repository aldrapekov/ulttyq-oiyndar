<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Домбырашы</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Звуковые файлы -->
    <audio id="audio-dombra" loop></audio>
    <audio id="audio-wrong" src="wrong_note.mp3"></audio>
    <div id="spinning-pattern"></div>
    
    <!-- Переворот экрана для мобильных -->
    <div id="rotate-screen" class="rotate-overlay">
        <div class="rotate-icon">📱</div>
        <h2>Бұрыңыз / Поверните экран</h2>
    </div>

    <!-- ИГРОВОЙ ЭКРАН -->
    <div id="dombra-screen" class="screen" style="padding: 45px 10px 10px 10px; box-sizing: border-box;">
        <button class="home-btn" onclick="window.location.href='menu.html?game=dombra'">🏠 Меню</button>
        
        <!-- Главный контейнер, разделенный на верх (видео/мальчик) и низ (управление) -->
        <div class="dombra-layout-clean">
            
            <!-- Верхняя зона: Видео игрока и полоса прогресса -->
            <div class="dombra-media-zone">
                <div class="melody-progress-container">
                    <div class="melody-bar" id="melody-progress"></div>
                </div>
                <video id="bg-video" src="dombra_playing.mp4" loop muted playsinline></video>
                <img id="bg-angry" src="boy_angry_bg.jpeg" style="display: none;">
            </div>

            <!-- Нижняя зона: Вопросы и сетка ответов -->
            <div class="dombra-bottom-zone" id="controls-panel">
                <div class="dombra-q-box" id="dombra-q">Загрузка вопроса...</div>
                <div class="baige-options" id="dombra-opt"></div>
            </div>

        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ПОБЕДЫ -->
    <div id="modal" class="modal-overlay">
        <div class="modal-content">
            <h2 id="winner-text" style="color:var(--blue); font-size: 1.5rem; margin-bottom: 15px;">Керемет! 🎵</h2>
            <p style="margin-bottom: 15px;">Мелодия сыграна до конца!</p>
            <button onclick="restartGame()" style="padding: 10px 20px; font-size: 1rem; background: var(--gold); border:none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-bottom: 10px;">Рестарт</button>
            <button onclick="window.location.href='menu.html?game=dombra'" style="padding: 10px 20px; font-size: 1rem; background: #eee; border: none; border-radius: 8px; cursor: pointer; width: 100%;">Меню</button>
        </div>
    </div>

    <script>
        // Игровые переменные (данные подтягиваются из настроек меню)
        let streak = 0;
        let targetStreak = parseInt(localStorage.getItem('dombra_streak')) || 7; 
        let questions = [];
        let currentQIndex = 0;

        const videoEl = document.getElementById('bg-video');
        const angryImg = document.getElementById('bg-angry');
        const progressBar = document.getElementById('melody-progress');
        const audioDombra = document.getElementById('audio-dombra');
        const audioWrong = document.getElementById('audio-wrong');
        const controlsPanel = document.getElementById('controls-panel');
        const modal = document.getElementById('modal');

        // Стандартные вопросы на случай, если пользователь ничего не вставил в меню
        const defaultQuestions = [
            { q: "Қазақ халқының екі ішекті шертпелі музыкалық аспабы қалай аталады?", options: ["Домбыра", "Қобыз", "Сыбызғы", "Жетіген"], correct: 0 },
            { q: "Құрманғазының әйгілі күйі қалай аталады?", options: ["Адай", "Қоштасу", "Желдірме", "Толғау"], correct: 0 },
            { q: "Домбыраның неше ішегі бар?", options: ["2", "3", "4", "6"], correct: 0 },
            { q: "«Ерке сылқым» күйінің авторы кім?", options: ["Әбдімомын Желдібаев", "Құрманғазы Сағырбайұлы", "Дина Нұрпейісова", "Тәттімбет"], correct: 0 },
            { q: "Шертпе күй мектебінің негізін салушы кім?", options: ["Тәттімбет Қазанғапұлы", "Құрманғазы", "Дәулеткерей", "Ықылас"], correct: 0 },
            { q: "Қобыз қандай аспаптар қатарына жатады?", options: ["Ысқышты", "Шертпелі", "Үрлемелі", "Ұрмалы"], correct: 0 },
            { q: "Әйгілі «Сарыарқа» күйінің авторы кім?", options: ["Құрманғазы", "Тәттімбет", "Құдайберген", "Мұхит"], correct: 0 }
        ];

        // Запуск при загрузке страницы
        window.onload = () => {
            // Подгружаем выбранный в меню кюй
            const selectedKui = localStorage.getItem('dombra_kui') || 'adai.mp3';
            audioDombra.src = selectedKui;

            // Загружаем кастомные вопросы из меню, если они есть
            const customJSON = localStorage.getItem('custom_questions');
            if (customJSON) {
                try {
                    const parsed = JSON.parse(customJSON);
                    // Поддержка формата ответа из промпта меню (где correct - строка, а wrong - массив)
                    questions = parsed.map(item => {
                        if (item.wrong && item.correct) {
                            let opts = [item.correct, ...item.wrong];
                            // Перемешиваем варианты
                            opts.sort(() => Math.random() - 0.5);
                            return { q: item.q, options: opts, correct: opts.indexOf(item.correct) };
                        }
                        return item; // Если формат уже стандартный
                    });
                } catch(e) {
                    questions = defaultQuestions;
                }
            } else {
                questions = defaultQuestions;
            }

            // Автозапуск музыки и видео при первом клике (обход ограничений браузеров)
            document.body.addEventListener('click', () => {
                if (audioDombra.paused && streak < targetStreak) audioDombra.play().catch(()=>{});
                if (videoEl.paused && streak < targetStreak) videoEl.play().catch(()=>{});
            }, { once: true });

            loadQuestion();
        };

        function loadQuestion() {
            if (questions.length === 0) return;
            const qData = questions[currentQIndex % questions.length];
            document.getElementById('dombra-q').innerText = qData.q;

            const optContainer = document.getElementById('dombra-opt');
            optContainer.innerHTML = '';

            qData.options.forEach((optText, index) => {
                const btn = document.createElement('button');
                btn.className = 'baige-btn'; // Используем красивые кнопки из Бәйге
                btn.style.background = 'var(--blue)';
                btn.innerText = optText;
                btn.onclick = () => checkAnswer(index === qData.correct);
                optContainer.appendChild(btn);
            });
        }

        function checkAnswer(isCorrect) {
            if (isCorrect) {
                streak++;
                progressBar.style.width = (streak / targetStreak) * 100 + '%';
                
                angryImg.style.display = 'none';
                videoEl.style.display = 'block';
                videoEl.play();
                
                audioWrong.pause();
                audioWrong.currentTime = 0;
                if (audioDombra.paused) audioDombra.play();

                if (streak >= targetStreak) {
                    setTimeout(() => {
                        modal.classList.add('active');
                        audioDombra.pause();
                        videoEl.pause();
                    }, 400);
                    return;
                }
            } else {
                streak = 0;
                progressBar.style.width = '0%';
                
                videoEl.pause();
                videoEl.style.display = 'none';
                angryImg.style.display = 'block';
                
                audioDombra.pause();
                audioWrong.currentTime = 0;
                audioWrong.play();
                
                // Тряска панели при ошибке
                controlsPanel.style.transition = 'transform 0.1s';
                controlsPanel.style.transform = 'translateX(-10px)';
                setTimeout(() => controlsPanel.style.transform = 'translateX(10px)', 100);
                setTimeout(() => controlsPanel.style.transform = 'translateX(0)', 200);
            }

            currentQIndex++;
            loadQuestion();
        }

        function restartGame() {
            modal.classList.remove('active');
            streak = 0;
            currentQIndex = 0;
            progressBar.style.width = '0%';
            angryImg.style.display = 'none';
            videoEl.style.display = 'block';
            videoEl.play();
            audioDombra.currentTime = 0;
            audioDombra.play();
            loadQuestion();
        }
    </script>
</body>
</html>
