<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULY DALA OYINDARY - Случайный Ученик</title>
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <style>
        :root {
            --blue: #00B1C1; --gold: #FFDA44; --red: #E30A17; --white: #ffffff; --purple: #6a1b9a;
        }
        body { margin: 0; padding: 0; font-family: 'Segoe UI', serif; background-color: #f0f0f0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        
        /* Кнопка возврата на главную */
        .back-button {
            position: fixed; top: 20px; left: 20px; background-color: white; color: var(--purple);
            padding: 10px 16px; border-radius: 8px; text-decoration: none; font-weight: bold;
            font-size: 0.95rem; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease; z-index: 1000; border: 1px solid #eee;
        }
        .back-button:hover { background-color: var(--purple); color: white; transform: translateY(-2px); }

        /* Переключатель языков */
        .lang-switcher {
            position: fixed; top: 20px; right: 20px; display: flex; gap: 5px; z-index: 1000;
        }
        .lang-switcher button {
            padding: 6px 12px; background-color: white; color: var(--purple); border: 1px solid #ddd;
            border-radius: 6px; font-size: 0.9rem; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .lang-switcher button:hover { background-color: var(--purple); color: white; border-color: var(--purple); }

        /* Основной контейнер */
        .main-container { text-align: center; z-index: 10; background: rgba(255,255,255,0.9); padding: 40px; border-radius: 20px; border: 4px solid var(--gold); box-shadow: 0 10px 30px rgba(0,0,0,0.2); transition: opacity 0.5s; }
        .main-title { color: var(--blue); font-size: 2.5rem; text-transform: uppercase; margin-bottom: 30px; }
        .sub-title { font-size: 1.5rem; margin-top: 0; }
        
        .action-btn { padding: 15px 40px; font-size: 1.2rem; border: none; border-radius: 10px; cursor: pointer; color: white; font-weight: bold; background-color: var(--blue); box-shadow: 0 5px 0 rgba(0,0,0,0.2); transition: 0.1s; margin-top: 15px;}
        .action-btn:active { transform: translateY(3px); box-shadow: none; }
        .action-btn:disabled { background-color: #ccc; cursor: not-allowed; }

        /* ОКНО КАМЕРЫ */
        #camera-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; background: black; z-index: 100; justify-content: center; align-items: center; }
        #video-element { height: 80vh; border: 5px solid var(--gold); border-radius: 15px; }
        #overlay-canvas { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); height: 80vh; pointer-events: none; }

        /* ОКНО РЕЗУЛЬТАТА */
        #result-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; background: rgba(0,0,0,0.9); z-index: 200; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        #final-photo { border: 10px solid var(--gold); border-radius: 15px; max-width: 80vw; max-height: 70vh; margin-bottom: 20px; box-shadow: 0 0 50px rgba(255,218,68,0.5); }
        .result-text { color: var(--gold); font-size: 3rem; font-weight: bold; text-transform: uppercase; animation: flash 1s infinite; }
        @keyframes flash { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        
        #close-result { position: absolute; top: 20px; right: 20px; font-size: 2rem; color: white; cursor: pointer; background: none; border: none;}
    </style>
</head>
<body>

    <!-- Кнопка возврата -->
    <a href="index.html" class="back-button" data-i18n="homeBtn">🏠 Главная</a>

    <!-- Переключатель языков -->
    <div class="lang-switcher">
        <button onclick="setLanguage('kk')">KZ</button>
        <button onclick="setLanguage('ru')">RU</button>
        <button onclick="setLanguage('en')">EN</button>
    </div>

    <div class="main-container" id="main-menu">
        <h1 class="main-title">ULY DALA OYINDARY</h1>
        <h2 class="sub-title" data-i18n="title">Выбор случайного ученика</h2>
        <p data-i18n="desc">Нажмите кнопку, загрузится нейросеть, затем учитель направит камеру на класс.<br>Ученик будет выбран автоматически.</p>
        <button class="action-btn" id="start-picker" onclick="randomPicker.init()" data-i18n="btnStart">Запустить Случайный Выбор</button>
        <p id="status-text" style="color:var(--red); font-weight:bold; margin-top: 15px;"></p>
    </div>

    <div id="camera-screen">
        <video id="video-element" autoplay muted></video>
        <canvas id="overlay-canvas"></canvas>
    </div>

    <div id="result-screen">
        <button id="close-result" onclick="randomPicker.hideResult()">×</button>
        <img id="final-photo" src="" alt="Фото победителя">
        <div class="result-text" data-i18n="resultText">выходит к доске!</div>
    </div>

<script>
    // --- СЛОВАРЬ ПЕРЕВОДОВ ---
    const translations = {
        ru: {
            homeBtn: "🏠 Главная",
            title: "Выбор случайного ученика",
            desc: "Нажмите кнопку, загрузится нейросеть, затем учитель направит камеру на класс.<br>Ученик будет выбран автоматически.",
            btnStart: "Запустить Случайный Выбор",
            resultText: "выходит к доске!",
            statusLoading: "⏳ Загрузка нейросети... Пожалуйста, подождите.",
            errCloud: "❌ Ошибка облачной загрузки. Проверьте интернет-соединение.",
            errCam: "❌ Нет доступа к камере.",
            errNoFace: "❌ Ученики не найдены. Попробуйте еще раз."
        },
        kk: {
            homeBtn: "🏠 Басты бет",
            title: "Кездейсоқ оқушыны таңдау",
            desc: "Түймені басыңыз, нейрожелі жүктеледі, содан кейін мұғалім камераны сыныпқа бағыттайды.<br>Оқушы автоматты түрде таңдалады.",
            btnStart: "Кездейсоқ таңдауды бастау",
            resultText: "тақтаға шығады!",
            statusLoading: "⏳ Нейрожелі жүктелуде... Күте тұрыңыз.",
            errCloud: "❌ Бұлттан жүктеу қатесі. Интернет қосылымын тексеріңіз.",
            errCam: "❌ Камераға қолжетімділік жоқ.",
            errNoFace: "❌ Оқушылар табылмады. Қайталап көріңіз."
        },
        en: {
            homeBtn: "🏠 Home",
            title: "Random Student Selector",
            desc: "Click the button to load the neural network, then point the camera at the class.<br>A student will be selected automatically.",
            btnStart: "Start Random Selection",
            resultText: "comes to the board!",
            statusLoading: "⏳ Loading neural network... Please wait.",
            errCloud: "❌ Cloud loading error. Check your internet connection.",
            errCam: "❌ No camera access.",
            errNoFace: "❌ No students found. Try again."
        }
    };

    let currentLang = 'ru';

    function setLanguage(lang) {
        currentLang = lang;
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (translations[lang] && translations[lang][key]) {
                el.innerHTML = translations[lang][key];
            }
        });
        localStorage.setItem('siteLanguage', lang);
    }

    // Подхватываем язык при загрузке страницы
    window.onload = () => {
        const savedLang = localStorage.getItem('siteLanguage') || 'ru';
        setLanguage(savedLang);
    };

    /**
     * ULY DALA OYINDARY: Random Student Picker
     */
    const randomPicker = {
        video: document.getElementById('video-element'),
        canvas: document.getElementById('overlay-canvas'),
        mainMenu: document.getElementById('main-menu'),
        camScreen: document.getElementById('camera-screen'),
        resScreen: document.getElementById('result-screen'),
        startBtn: document.getElementById('start-picker'),
        status: document.getElementById('status-text'),
        photo: document.getElementById('final-photo'),
        
        isDetecting: false,
        detectionLoop: null,
        modelsLoaded: false,

        async init() {
            if (this.modelsLoaded) {
                this.startCamera();
                return;
            }

            this.startBtn.disabled = true;
            // Использование динамического перевода
            this.status.innerText = translations[currentLang].statusLoading;

            try {
                const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/'; 
                await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
                
                this.modelsLoaded = true;
                this.status.innerText = "";
                this.startCamera();
            } catch (err) {
                this.status.innerText = translations[currentLang].errCloud;
                console.error(err);
                this.startBtn.disabled = false;
            }
        },

        async startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                this.video.srcObject = stream;
                
                this.mainMenu.style.display = 'none';
                this.camScreen.style.display = 'flex';

                this.video.onplay = () => {
                    const displaySize = { width: this.video.videoWidth, height: this.video.videoHeight };
                    faceapi.matchDimensions(this.canvas, displaySize);
                    this.startDetection();
                };
            } catch (err) {
                this.mainMenu.style.display = 'block';
                this.camScreen.style.display = 'none';
                alert(translations[currentLang].errCam);
                console.error(err);
                this.startBtn.disabled = false;
            }
        },

        startDetection() {
            this.isDetecting = true;
            const displaySize = { width: this.video.videoWidth, height: this.video.videoHeight };
            
            setTimeout(() => this.pickRandomStudent(), 5000);

            this.detectionLoop = setInterval(async () => {
                if (!this.isDetecting) return;

                const detections = await faceapi.detectAllFaces(this.video, new faceapi.TinyFaceDetectorOptions());
                const resizedDetections = faceapi.resizeResults(detections, displaySize);
                
                this.canvas.getContext('2d').clearRect(0, 0, this.canvas.width, this.canvas.height);
                faceapi.draw.drawDetections(this.canvas, resizedDetections);
            }, 100); 
        },

        async pickRandomStudent() {
            this.isDetecting = false;
            clearInterval(this.detectionLoop);

            const detections = await faceapi.detectAllFaces(this.video, new faceapi.TinyFaceDetectorOptions());
            
            if (detections.length === 0) {
                alert(translations[currentLang].errNoFace);
                this.stopCamera();
                return;
            }

            const randomIndex = Math.floor(Math.random() * detections.length);
            const selectedFace = detections[randomIndex];
            
            this.zoomAndCapture(selectedFace);
        },

        zoomAndCapture(faceData) {
            const { x, y, width, height } = faceData.box;
            const zoomScale = Math.max(2, this.video.videoWidth / (width * 1.5));
            const centerX = ((x + width/2) / this.video.videoWidth) * 100;
            const centerY = ((y + height/2) / this.video.videoHeight) * 100;
            
            this.video.style.transition = "transform 1.5s ease-in-out, transform-origin 1.5s ease-in-out";
            this.video.style.transformOrigin = `${centerX}% ${centerY}%`;
            this.video.style.transform = `scale(${zoomScale})`;
            this.canvas.style.display = 'none'; 

            setTimeout(() => {
                this.takeFinalPhoto(faceData, zoomScale);
            }, 1600);
        },

        takeFinalPhoto(faceData, zoomScale) {
            const tempCanvas = document.createElement('canvas');
            const ctx = tempCanvas.getContext('2d');
            
            const cropWidth = faceData.box.width * 1.8;
            const cropHeight = faceData.box.height * 1.8;
            const cropX = faceData.box.x - (cropWidth - faceData.box.width) / 2;
            const cropY = faceData.box.y - (cropHeight - faceData.box.height) / 2;

            tempCanvas.width = cropWidth;
            tempCanvas.height = cropHeight;

            ctx.drawImage(this.video, cropX, cropY, cropWidth, cropHeight, 0, 0, cropWidth, cropHeight);
            
            const photoDataUrl = tempCanvas.toDataURL('image/png');
            this.photo.src = photoDataUrl;
            this.showResult();
        },

        showResult() {
            this.stopCamera();
            this.camScreen.style.display = 'none';
            this.resScreen.style.display = 'flex';
        },

        hideResult() {
            this.resScreen.style.display = 'none';
            this.mainMenu.style.display = 'block';
            this.photo.src = "";
            this.startBtn.disabled = false;
        },

        stopCamera() {
            if (this.video.srcObject) {
                this.video.srcObject.getTracks().forEach(track => track.stop());
                this.video.srcObject = null;
                this.video.style.transition = "none";
                this.video.style.transform = "scale(1)";
                this.canvas.style.display = 'block';
            }
        }
    };
</script>
</body>
</html>
